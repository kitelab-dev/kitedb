name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v1.0.0
        required: true

permissions:
  contents: write

jobs:
  build:
    # Homebrew bottles built for macOS 14 keep the bundled client libraries
    # (and therefore the app) runnable on macOS 14 and later.
    runs-on: macos-14
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      MYSQL_PREFIX: /opt/homebrew/opt/mysql-client
      LIBPQ_PREFIX: /opt/homebrew/opt/libpq
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          swift --version

      - name: Install client libraries
        run: brew install libpq mysql-client

      - name: Build app and disk image
        run: |
          export VERSION="${TAG#v}"
          ./scripts/build-app.sh
          ./scripts/make-dmg.sh
          plutil -p "build/KiteDB.app/Contents/Info.plist" | grep -E "Version|Minimum"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "KiteDB ${TAG#v}" --notes-file ../.github/release-notes.md --generate-notes
          fi
          gh release upload "$TAG" build/KiteDB.dmg build/KiteDB.dmg.sha256 --clobber

  linux:
    # Runs after the macOS job, which creates the GitHub release.
    needs: build
    # Ubuntu 24.04 ships GTK 4.14 and libadwaita 1.5, the oldest versions the
    # app targets, so the binary runs on 24.04-era distributions and newer.
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v5

      - name: Install GTK 4 and libadwaita
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          cargo --version

      - name: Lint and unit tests
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --lib --locked

      - name: Build package
        run: VERSION="${TAG#v}" ./scripts/package.sh

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" build/KiteDB-linux-x86_64.tar.gz build/KiteDB-linux-x86_64.tar.gz.sha256 --clobber
