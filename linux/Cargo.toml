[package]
name = "kitedb"
version = "1.0.0"
edition = "2024"
description = "A simple, native desktop client for MySQL and PostgreSQL"
license = "MIT"
repository = "https://github.com/kitelab-dev/kitedb"
homepage = "https://kitedb.dotly.mn"
publish = false

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
futures-channel = "0.3"
keyring = "4.2.0"
mysql = { version = "28.0.4", default-features = false, features = ["minimal-rust", "rustls-tls-ring"] }
postgres = "0.19.14"
regex = "1.13.1"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio-postgres-rustls = "0.14.0"
uuid = { version = "1.28.0", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
strip = true
